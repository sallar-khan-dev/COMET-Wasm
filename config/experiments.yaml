experiment:
  confidence_level: 0.95
  relative_ci_target: 0.025
  repetitions:
    minimum: 20
    maximum: 60
  warmup_runs: 2
  cooldown_seconds: 1
  concurrency:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  - 128
  - 256
  tenants:
  - 1
  - 5
  - 10
  - 20
  - 50
  - 100
  - 200
  metrics:
  - throughput_rps
  - mean_latency_ms
  - p50_latency_ms
  - p90_latency_ms
  - p95_latency_ms
  - p99_latency_ms
  - max_latency_ms
  - rss_mib
  - pss_mib
  - cpu_percent
  - error_rate
  - cold_start_ms
  density:
    levels:
    - 1
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    warmup_requests_per_unit: 100
    memory_samples: 5
    memory_sample_interval_seconds: 0.25
    readiness_timeout_seconds: 30
