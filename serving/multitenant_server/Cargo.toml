[package]
name = "comet_multitenant_server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
wasmtime = "44"

comet_worker_pool = {
    path = "../worker_pool"
}
